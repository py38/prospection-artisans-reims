<style>
  :root {
    --navy: #1C2B4A; --red: #A8402F; --green: #3D6B4A; --amber: #B8863B;
    --paper: #EFEAE0; --ink: #241F1B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Iowan Old Style', serif;
    background: var(--paper); color: var(--ink);
  }
  .mono { font-family: 'Courier New', Courier, monospace; }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--paper);
    border-bottom: 3px double var(--ink); padding: 16px 16px 12px;
  }
  .eyebrow { font-size: 10.5px; letter-spacing: 0.1em; color: #24181399; }
  h1 { font-size: 19px; margin: 2px 0 10px; }
  .counts { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .count-chip { font-size: 10.5px; border-radius: 3px; padding: 3px 7px; border: 1px solid; }
  input[type=text], select {
    font-family: Georgia, serif; background: #fff; border: 1px solid #24181344;
    border-radius: 4px; padding: 7px 9px; font-size: 13px; color: var(--ink);
  }
  .search-wrap { position: relative; margin-bottom: 8px; }
  .search-wrap input { width: 100%; padding-left: 30px; }
  .search-icon { position: absolute; left: 9px; top: 9px; color: #24181388; font-size: 13px; }
  .filters { display: flex; gap: 8px; }
  .filters select { flex: 1; }
  main { padding: 12px 16px 100px; }
  .result-count { font-size: 12px; color: #24181388; margin-bottom: 10px; }
  .list { display: grid; gap: 10px; }
  .card {
    background: #fff; border: 1px solid #24181322; border-radius: 4px; padding: 12px;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.04);
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .card-metier { font-family: 'Courier New', monospace; font-size: 10.5px; color: var(--navy); margin-top: 2px; }
  .card-addr { font-size: 12px; color: #24181399; margin-top: 4px; }
  .status-chip { font-family: 'Courier New', monospace; font-size: 9.5px; border-radius: 3px; padding: 3px 6px; white-space: nowrap; border: 1px solid; }
  .card-actions { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  .call-btn {
    display: inline-flex; align-items: center; gap: 6px; background: var(--navy); color: #fff;
    text-decoration: none; padding: 9px 14px; border-radius: 4px; font-size: 13px; font-weight: 700;
    font-family: 'Courier New', monospace; letter-spacing: 0.03em;
  }
  .status-btn {
    font-family: 'Courier New', monospace; font-size: 10.5px; padding: 5px 8px; border-radius: 3px;
    font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; border: 1px solid transparent;
    cursor: pointer;
  }
  .reset-footer {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--paper);
    border-top: 2px solid #24181333; padding: 8px 16px; text-align: center;
  }
  .reset-footer button {
    background: none; border: none; color: #24181377; font-size: 10.5px;
    text-decoration: underline; padding: 4px; cursor: pointer; font-family: 'Courier New', monospace;
  }
  .no-tel { font-family: 'Courier New', monospace; font-size: 12px; color: #24181366; font-style: italic; }
</style>
</head>
<body>

<header>

</header>

<main>

</main>

<div class="reset-footer">

</div>

const STATUSES = {
  a_appeler:   { label: "À appeler",   color: "#8a8378", bg: "#ffffff" },
  pas_repondu: { label: "Pas répondu", color: "#B8863B", bg: "#FBF2E3" },
  rdv:         { label: "RDV pris",    color: "#3D6B4A", bg: "#EAF2EC" },
  refuse:      { label: "Refusé",      color: "#A8402F", bg: "#F7EBE9" },
};

let statusMap = JSON.parse(localStorage.getItem("call-status-map") || "{}");
let filterMetier = "Tous";
let filterStatus = "Tous";
let search = "";

function persist() {
  localStorage.setItem("call-status-map", JSON.stringify(statusMap));
}

function setStatus(id, key) {
  statusMap[id] = key;
  persist();
  render();
}

function resetAll() {
  if (confirm("Réinitialiser tous les statuts d'appel ?")) {
    statusMap = {};
    persist();
    render();
  }
}

function initFilters() {
  const metiers = ["Tous", ...new Set(PROSPECTS.map(p => p.metier))];
  const sel = document.getElementById("filterMetier");
  sel.innerHTML = metiers.map(m => `<option value="${m}">${m}</option>`).join("");
  sel.addEventListener("change", e => { filterMetier = e.target.value; render(); });
  document.getElementById("filterStatus").addEventListener("change", e => { filterStatus = e.target.value; render(); });
  document.getElementById("search").addEventListener("input", e => { search = e.target.value; render(); });
}

function render() {
  const counts = { a_appeler: 0, pas_repondu: 0, rdv: 0, refuse: 0 };
  PROSPECTS.forEach(p => {
    const st = statusMap[p.id] || "a_appeler";
    counts[st] = (counts[st] || 0) + 1;
  });
  document.getElementById("counts").innerHTML = Object.entries(STATUSES).map(([key, s]) =>
    `<div class="count-chip" style="background:${s.bg};color:${s.color};border-color:${s.color}55">${s.label}: ${counts[key] || 0}</div>`
  ).join("");

  const filtered = PROSPECTS.filter(p => {
    if (filterMetier !== "Tous" && p.metier !== filterMetier) return false;
    const st = statusMap[p.id] || "a_appeler";
    if (filterStatus !== "Tous" && st !== filterStatus) return false;
    if (search) {
      const s = search.toLowerCase();
      if (!p.nom.toLowerCase().includes(s) && !p.ville.toLowerCase().includes(s)) return false;
    }
    return true;
  });

  document.getElementById("resultCount").textContent = `${filtered.length} prospect${filtered.length > 1 ? "s" : ""}`;

  const list = document.getElementById("list");
  if (filtered.length === 0) {
    list.innerHTML = `<div style="text-align:center;padding:30px;color:#24181366;font-style:italic;">Aucun prospect ne correspond à ces filtres.</div>`;
    return;
  }

  list.innerHTML = filtered.map(p => {
    const st = statusMap[p.id] || "a_appeler";
    const info = STATUSES[st];
    const telHref = p.tel ? `tel:${p.tel.replace(/\s/g, "")}` : null;
    return `
      <div class="card">
        <div class="card-top">
          <div style="flex:1;min-width:0;">
            <div class="card-name">${p.nom}</div>
            <div class="card-metier">${p.metier}</div>
            <div class="card-addr">&#128205; ${p.adresse}</div>
          </div>
          <span class="status-chip" style="background:${info.bg};color:${info.color};border-color:${info.color}55">${info.label}</span>
        </div>
        <div class="card-actions">
          ${telHref ? `<a class="call-btn" href="${telHref}">&#128222; ${p.tel}</a>` : `<span class="no-tel">Pas de numéro</span>`}
          <button class="status-btn" style="background:#B8863B22;color:#B8863B" onclick="setStatus('${p.id}','pas_repondu')">Pas répondu</button>
          <button class="status-btn" style="background:#3D6B4A22;color:#3D6B4A" onclick="setStatus('${p.id}','rdv')">RDV</button>
          <button class="status-btn" style="background:#A8402F22;color:#A8402F" onclick="setStatus('${p.id}','refuse')">Refusé</button>
          ${st !== "a_appeler" ? `<button class="status-btn" style="background:none;color:#24181388;border:1px solid #24181333" onclick="setStatus('${p.id}','a_appeler')">Réinit.</button>` : ""}
        </div>
      </div>
    `;
  }).join("");
}

initFilters();
render();
</script>
